<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1A2140">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Суфлёр — выучи стих с подсказками</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,400;7..72,600&family=Manrope:wght@500;700;800&display=swap">
<style>
:root{--bg:#EEF1F7;--card:#fff;--ink:#1A2140;--mut:#5E6685;--line:#D9DEEA;--acc:#E2551E;--accsoft:#FDE6DB;--ok:#1B8A69;--ui:'Manrope',system-ui,sans-serif;--ser:'Literata',Georgia,serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121726;--card:#1B2238;--ink:#E8ECF8;--mut:#9AA3C2;--line:#2A3350;--acc:#FF7A45;--accsoft:#3A2A2A;--ok:#43C79F}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--ui)}
body{min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.app{max-width:560px;margin:0 auto;padding:16px 16px 40px}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.logo{font-family:var(--ser);font-weight:600;font-size:26px;letter-spacing:-.5px}
.pill{display:flex;gap:6px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:7px 13px;font-weight:800}
.hero{background:var(--ink);color:var(--bg);border-radius:24px;padding:20px;display:flex;gap:16px;align-items:center}
.flame{font-size:54px;line-height:1;transition:transform .3s}
.flame.on{animation:fl 1.6s ease-in-out infinite}
@keyframes fl{50%{transform:scale(1.1) rotate(-4deg)}}
@media (prefers-reduced-motion:reduce){.flame.on{animation:none}}
.hero b{font-size:34px;display:block;line-height:1}
.hero span{opacity:.75;font-size:14px}
.week{display:flex;gap:6px;margin-top:10px}
.week i{width:24px;height:24px;border-radius:8px;background:#ffffff26;font-style:normal;font-size:11px;display:grid;place-items:center}
.week i.d{background:var(--acc);color:#fff}
h2{font-size:16px;margin:22px 4px 10px}
.item{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:10px}
.item .t{flex:1;min-width:0}
.item b{display:block}
.item small{color:var(--mut)}
.bar{height:6px;border-radius:6px;background:var(--line);margin-top:8px;overflow:hidden}
.bar div{height:100%;background:var(--ok);border-radius:6px}
.x{color:var(--mut);padding:6px 10px;font-size:20px}
.add{width:100%;border:2px dashed var(--line);border-radius:18px;padding:14px;font-weight:700;color:var(--mut)}
.prem{background:var(--accsoft);border-radius:18px;padding:16px;margin-top:18px}
.prem p{margin:4px 0 12px;color:var(--mut);font-size:14px}
.btn{background:var(--acc);color:#fff;font-weight:800;border-radius:14px;padding:12px 18px}
.btn.alt{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.ad{margin-top:16px;border:1px dashed var(--line);border-radius:12px;padding:10px;text-align:center;color:var(--mut);font-size:12px}
.hide{display:none!important}
.bk{font-weight:800;padding:8px 4px}
.modes{display:flex;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:4px;margin:10px 0}
.modes button{flex:1;padding:10px 2px;border-radius:12px;font-weight:700;font-size:13px;color:var(--mut)}
.modes button.on{background:var(--ink);color:var(--bg)}
.desc{color:var(--mut);font-size:14px;margin:0 4px 12px;min-height:2.6em}
.text{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:22px 20px;font-family:var(--ser);font-size:21px;line-height:1.7;min-height:300px}
.text .ln{display:block}
.w{transition:color .25s,opacity .25s;border-radius:4px}
.w.done{opacity:.4}
.w.cur{background:var(--accsoft);box-shadow:0 0 0 3px var(--accsoft)}
.text.blind .w.fut{color:transparent;border-bottom:2px solid var(--line);user-select:none}
.text.blind .w.cur.shown{color:inherit;border-bottom:0}
.text.blind .w.cur:not(.shown){color:transparent;border-bottom:2px solid var(--acc)}
.w.hid{color:transparent;border-bottom:2px solid var(--mut);cursor:pointer}
.w.hid.rv{color:inherit;border-bottom-color:transparent}
.ctl{display:flex;align-items:center;justify-content:center;gap:18px;margin:18px 0 6px}
.mic{width:84px;height:84px;border-radius:50%;background:var(--acc);color:#fff;font-size:34px;box-shadow:0 8px 24px #e2551e55}
.mic.live{animation:pu 1.3s infinite}
@keyframes pu{50%{box-shadow:0 0 0 14px #e2551e22}}
@media (prefers-reduced-motion:reduce){.mic.live{animation:none}}
.sm{width:52px;height:52px;border-radius:50%;background:var(--card);border:1px solid var(--line);font-size:20px}
.status{text-align:center;color:var(--mut);font-size:14px;min-height:1.4em}
.sheet{position:fixed;inset:0;background:#0008;display:flex;align-items:flex-end;justify-content:center;z-index:9}
.sheet>div{background:var(--card);width:100%;max-width:560px;border-radius:24px 24px 0 0;padding:20px 20px calc(24px + env(safe-area-inset-bottom,0px));max-height:90vh;overflow:auto}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:14px 0}
.row input[type=range]{width:55%;accent-color:var(--acc)}
select,input[type=text],textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px;width:100%}
textarea{min-height:180px;margin-top:10px;font-family:var(--ser)}
.row select{width:auto}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:14px;z-index:20;font-weight:700;max-width:90%;text-align:center}
</style>
</head>
<body>
<div class="app">
<div class="top"><div class="logo">Суфлёр</div><div class="pill" id="sp">🔥 <span id="sn">0</span></div></div>

<section id="home">
  <div class="hero"><div class="flame" id="fl">🔥</div>
    <div><b id="hb">0 дней</b><span id="hs">Выучи строчку — зажги огонёк</span><div class="week" id="wk"></div></div></div>
  <h2>Мои стихи</h2><div id="list"></div>
  <button class="add" id="addb">+ Вставить свой текст</button>
  <div class="prem"><b>Premium без рекламы</b><p>Безлимит текстов, все режимы, красивые голоса, заморозка огонька.</p><button class="btn" id="premb">Попробовать 7 дней бесплатно</button></div>
  <div class="ad">Здесь будет баннер рекламы</div>
</section>

<section id="play" class="hide">
  <div style="display:flex;justify-content:space-between;align-items:center"><button class="bk" id="back">← Назад</button><button class="bk" id="setb">⚙ Настройки</button></div>
  <div style="font-family:var(--ser);font-size:22px;font-weight:600;margin:4px 4px 0" id="ttl"></div>
  <div class="modes" id="modes">
    <button data-m="echo" class="on">Эхо</button><button data-m="prompt">Суфлёр</button><button data-m="radio">Радио</button><button data-m="learn">Заучивание</button>
  </div>
  <p class="desc" id="desc"></p>
  <div class="text" id="txt"></div>
  <div class="status" id="st"></div>
  <div class="ctl" id="ctl">
    <button class="sm" id="prev" aria-label="Назад">⏮</button>
    <button class="mic" id="mic" aria-label="Старт">🎙</button>
    <button class="sm" id="next" aria-label="Дальше">⏭</button>
  </div>
  <div class="ctl hide" id="lctl">
    <button class="btn alt" id="easy">Легче</button><button class="btn" id="hard">Сложнее</button><button class="btn alt" id="learned">Выучил ✓</button>
  </div>
</section>
</div>

<div class="sheet hide" id="set"><div>
  <b style="font-size:18px">Настройки</b>
  <div class="row"><label for="rate">Скорость чтения</label><input type="range" id="rate" min="0.6" max="1.5" step="0.1"></div>
  <div class="row"><label for="chunk">Размер куска</label><select id="chunk"><option value="2">2 слова</option><option value="3">3 слова</option><option value="5">5 слов</option><option value="0">Строка</option></select></div>
  <div class="row"><label for="pause">Подсказка через (сек)</label><input type="range" id="pause" min="2" max="8" step="1"></div>
  <div class="row"><label for="rep">Ждать, пока я повторю</label><input type="checkbox" id="rep"></div>
  <button class="btn" style="width:100%" id="setx">Готово</button>
</div></div>

<div class="sheet hide" id="new"><div>
  <b style="font-size:18px">Свой текст</b>
  <input type="text" id="nt" placeholder="Название" style="margin-top:10px">
  <textarea id="nb" placeholder="Вставь стих или речь. Каждая строка с новой строки."></textarea>
  <div class="row"><button class="btn alt" id="nx">Отмена</button><button class="btn" id="ns">Сохранить</button></div>
</div></div>

<script>
const LIB=[
{id:'p1',t:'У Лукоморья дуб зелёный',a:'А. С. Пушкин',b:`У лукоморья дуб зелёный;
Златая цепь на дубе том:
И днём и ночью кот учёный
Всё ходит по цепи кругом;
Идёт направо — песнь заводит,
Налево — сказку говорит.
Там чудеса: там леший бродит,
Русалка на ветвях сидит;`},
{id:'l1',t:'Парус',a:'М. Ю. Лермонтов',b:`Белеет парус одинокой
В тумане моря голубом!..
Что ищет он в стране далёкой?
Что кинул он в краю родном?..
Играют волны — ветер свищет,
И мачта гнётся и скрипит...
Увы! он счастия не ищет
И не от счастия бежит!
Под ним струя светлей лазури,
Над ним луч солнца золотой...
А он, мятежный, просит бури,
Как будто в бурях есть покой!`},
{id:'p2',t:'Я вас любил',a:'А. С. Пушкин',b:`Я вас любил: любовь ещё, быть может,
В душе моей угасла не совсем;
Но пусть она вас больше не тревожит;
Я не хочу печалить вас ничем.
Я вас любил безмолвно, безнадежно,
То робостью, то ревностью томим;
Я вас любил так искренно, так нежно,
Как дай вам Бог любимой быть другим.`}];
const DESC={echo:'Приложение говорит кусок — ты повторяешь. Дальше идём, когда услышим тебя.',prompt:'Читай сам по памяти. Если замолчал, суфлёр подскажет следующие слова.',radio:'Стих читается сам, по кругу. Включи, когда скучно или засыпаешь.',learn:'Слова постепенно пропадают. Нажми на пропуск, чтобы подсмотреть.'};
const $=s=>document.querySelector(s);
const day=d=>{const x=new Date(d||Date.now());return x.getFullYear()+'-'+(x.getMonth()+1)+'-'+x.getDate()};
let S={streak:0,last:'',days:[],texts:[],prog:{},rate:1,chunk:3,pause:4,rep:true};
try{Object.assign(S,JSON.parse(localStorage.getItem('sufler')||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem('sufler',JSON.stringify(S))}catch(e){}};
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let cur,mode='echo',run=0,idx=0,words=[],chunks=[],rec=null,pending=null,hintT=null,shown=false,level=1,reveal=new Set(),playing=false;
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2600)}
function streakNow(){return(S.last===day()||S.last===day(Date.now()-864e5))?S.streak:0}
function home(){
  const n=streakNow(),on=S.last===day();
  $('#sn').textContent=n;$('#hb').textContent=n+' '+(n%10===1&&n!==11?'день':(n%10>1&&n%10<5&&(n<10||n>20)?'дня':'дней'));
  $('#hs').textContent=on?'Сегодня огонёк горит':'Выучи строчку — зажги огонёк';
  $('#fl').className='flame'+(on?' on':'');$('#fl').style.filter=on?'none':'grayscale(1) opacity(.6)';
  $('#wk').innerHTML=[6,5,4,3,2,1,0].map(i=>{const d=new Date(Date.now()-i*864e5);return`<i class="${S.days.includes(day(d))?'d':''}">${'вп вт ср чт пт сб вс'.split(' ')[(d.getDay()+6)%7]}</i>`}).join('');
  const all=[...LIB,...S.texts];
  $('#list').innerHTML=all.map(x=>`<div class="item" role="button" tabindex="0" data-id="${x.id}"><div class="t"><b>${esc(x.t)}</b><small>${esc(x.a||'Мой текст')}</small><div class="bar"><div style="width:${S.prog[x.id]||0}%"></div></div></div>${x.c?`<button class="x" data-del="${x.id}" aria-label="Удалить">×</button>`:''}<small>${S.prog[x.id]||0}%</small></div>`).join('');
}
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function open(id){
  cur=[...LIB,...S.texts].find(x=>x.id===id);stop();
  words=[];cur.b.split('\n').map(l=>l.trim()).filter(Boolean).forEach((l,li)=>l.split(/\s+/).forEach(w=>words.push({w,li})));
  $('#ttl').textContent=cur.t;$('#home').classList.add('hide');$('#play').classList.remove('hide');setMode('echo');
}
function build(){
  const n=+S.chunk;chunks=[];
  if(!n){let s=0;for(let i=1;i<=words.length;i++)if(i===words.length||words[i].li!==words[s].li){chunks.push([s,i-1]);s=i}}
  else for(let i=0;i<words.length;i+=n)chunks.push([i,Math.min(i+n-1,words.length-1)]);
}
const ctext=i=>words.slice(chunks[i][0],chunks[i][1]+1).map(x=>x.w).join(' ');
function setMode(m){
  stop();mode=m;idx=0;shown=false;build();
  document.querySelectorAll('#modes button').forEach(b=>b.classList.toggle('on',b.dataset.m===m));
  $('#desc').textContent=DESC[m];$('#ctl').classList.toggle('hide',m==='learn');$('#lctl').classList.toggle('hide',m!=='learn');
  $('#prev').classList.toggle('hide',m==='radio');$('#next').classList.toggle('hide',m==='radio');
  $('#st').textContent=m==='learn'?'Уровень '+level+' из 4':'Нажми на микрофон';render();
}
function render(){
  const c=chunks[Math.min(idx,chunks.length-1)]||[0,0];let h='',last=-1;
  words.forEach((x,i)=>{
    if(x.li!==last){if(last>=0)h+='</span>';h+='<span class="ln">';last=x.li}
    let cl='w';
    if(mode==='learn'){if(((i*37+11)%100)<level*22-(level>3?0:0)&&true)cl+=' hid'+(reveal.has(i)?' rv':'')}
    else if(playing||idx>0){if(i<c[0])cl+=' done';else if(i<=c[1])cl+=' cur'+(shown||mode==='echo'?' shown':'');else cl+=' fut'}
    h+=`<span class="${cl}" data-i="${i}">${esc(x.w)}</span> `;
  });
  $('#txt').innerHTML=h+'</span>';$('#txt').classList.toggle('blind',mode==='prompt'&&playing);
}
function norm(s){return s.toLowerCase().replace(/ё/g,'е').replace(/[^а-яa-z0-9\s]/g,' ').split(/\s+/).filter(Boolean)}
function score(t,said){const a=norm(t),b=new Set(norm(said));return a.length?a.filter(w=>b.has(w)).length/a.length:0}
function say(t){return new Promise(r=>{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='ru-RU';u.rate=+S.rate;const v=speechSynthesis.getVoices().find(v=>v.lang&&v.lang.startsWith('ru'));if(v)u.voice=v;u.onend=r;u.onerror=r;speechSynthesis.speak(u)})}
function stopRec(){try{rec&&(rec.onend=null,rec.abort())}catch(e){}rec=null;clearTimeout(hintT)}
function listen(text,my,hintMs){
  return new Promise(res=>{
    let done=false;const fin=v=>{if(done)return;done=true;stopRec();pending=null;res(v)};pending=()=>fin('skip');
    if(my!==run)return;
    if(!SR){$('#st').textContent='Повтори вслух и нажми ⏭';return}
    $('#st').textContent='Слушаю…';$('#mic').classList.add('live');
    rec=new SR();rec.lang='ru-RU';rec.continuous=true;rec.interimResults=true;
    rec.onstart=()=>{$('#st').textContent='Слушаю… говори'};rec.onresult=e=>{let t='';for(const r of e.results)t+=r[0].transcript+' ';$('#st').textContent='Слышу: «'+t.trim()+'»';if(score(text,t)>=.6)fin('ok')};
    rec.onerror=e=>{if(e.error==='no-speech'||e.error==='aborted')return;$('#st').textContent=(e.error==='not-allowed'||e.error==='service-not-allowed')?'Браузер блокирует микрофон на этой странице. Открой ссылку в Chrome/Safari. Пока жми ⏭':'Ошибка микрофона: '+e.error+'. Жми ⏭'};
    rec.onend=()=>{if(!done&&my===run)try{rec.start()}catch(e){}};
    try{rec.start()}catch(e){}
    if(hintMs)hintT=setTimeout(()=>fin('timeout'),hintMs);
  });
}
async function go(){
  const my=++run;playing=true;$('#mic').textContent='⏸';
  while(my===run){
    if(idx>=chunks.length){if(mode==='radio'){idx=0;await sleep(2000);if(my!==run)return;continue}break}
    const t=ctext(idx);shown=false;render();
    if(mode==='echo'){$('#st').textContent='Слушай…';await say(t);if(my!==run)return;if(S.rep){await sleep(600);if(my!==run)return;await listen(t,my,0)}else await sleep(500);}
    else if(mode==='prompt'){const r=await listen(t,my,S.pause*1000);if(my!==run)return;if(r==='timeout'){shown=true;render();$('#st').textContent='Подсказка';await say(t);if(my!==run)return;await listen(t,my,0)}}
    else{$('#st').textContent='Читаю…';await say(t);await sleep(700/ +S.rate)}
    if(my!==run)return;
    idx++;
  }
  if(my===run){stop();finish(mode==='echo'?40:80)}
}
function stop(){run++;playing=false;pending=null;stopRec();try{speechSynthesis.cancel()}catch(e){}$('#mic').textContent='🎙';$('#mic').classList.remove('live');if(!$('#play').classList.contains('hide')&&mode!=='learn')$('#st').textContent='Нажми на микрофон';}
function finish(p){
  S.prog[cur.id]=Math.max(S.prog[cur.id]||0,p);
  const t=day();if(S.last!==t){S.streak=S.last===day(Date.now()-864e5)?S.streak+1:1;S.last=t;S.days.push(t)}
  save();idx=0;render();$('#st').textContent='Готово! 🔥 Серия: '+S.streak;toast('Огонёк горит: '+S.streak+' дн.');home();
}
$('#list').onclick=e=>{const d=e.target.closest('[data-del]');if(d){S.texts=S.texts.filter(x=>x.id!==d.dataset.del);save();home();return}const i=e.target.closest('.item');if(i)open(i.dataset.id)};
$('#back').onclick=()=>{stop();$('#play').classList.add('hide');$('#home').classList.remove('hide');home()};
$('#modes').onclick=e=>{const b=e.target.closest('button');if(b)setMode(b.dataset.m)};
$('#mic').onclick=()=>playing?stop():go();
$('#next').onclick=()=>{if(pending)pending();else if(idx<chunks.length-1){idx++;render()}};
$('#prev').onclick=()=>{idx=Math.max(0,idx-1);render()};
$('#txt').onclick=e=>{const w=e.target.closest('.hid');if(w){reveal.add(+w.dataset.i);render();setTimeout(()=>{reveal.delete(+w.dataset.i);render()},1500)}};
$('#hard').onclick=()=>{level=Math.min(4,level+1);setMode('learn')};
$('#easy').onclick=()=>{level=Math.max(1,level-1);setMode('learn')};
$('#learned').onclick=()=>finish(level>=3?100:60);
$('#setb').onclick=()=>{$('#rate').value=S.rate;$('#chunk').value=S.chunk;$('#pause').value=S.pause;$('#rep').checked=S.rep;$('#set').classList.remove('hide')};
$('#setx').onclick=()=>{S.rate=+$('#rate').value;S.chunk=+$('#chunk').value;S.pause=+$('#pause').value;S.rep=$('#rep').checked;save();$('#set').classList.add('hide');setMode(mode)};
$('#addb').onclick=()=>$('#new').classList.remove('hide');
$('#nx').onclick=()=>$('#new').classList.add('hide');
$('#ns').onclick=()=>{const t=$('#nt').value.trim()||'Мой текст',b=$('#nb').value.trim();if(!b){toast('Вставь текст');return}S.texts.push({id:'c'+Date.now(),t,b,c:1});save();$('#nt').value=$('#nb').value='';$('#new').classList.add('hide');home()};
